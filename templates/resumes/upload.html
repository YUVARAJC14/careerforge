{% extends "base.html" %}
{% block title %}Upload Resume — CareerForge{% endblock %}

{% block content %}
{% if error %}
<div class="mb-4 px-4 py-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
    {{ error }}
</div>
{% endif %}
<div class="max-w-lg">
    <h1 class="font-display text-2xl font-bold mb-2">Upload your resume</h1>
    <p class="text-slate-500 text-sm mb-6">PDF or DOCX — we'll extract the text and start matching you against live listings.</p>

    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        <input type="file" name="resume_file" accept=".pdf,.docx" required
            class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-amber-500 file:text-black file:font-medium file:text-sm hover:file:bg-amber-400">
        <button type="submit"
            class="w-full py-2.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-black text-sm font-semibold transition">
            Upload
        </button>
    </form>
</div>
{% endblock %}
